<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seviliyorsun dostumm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* TÜM SAYFA STİLLERİ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #030712;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- YENİ: GİRİŞ EKRANI VE BUTON --- */
        .intro-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #030712;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .intro-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .open-btn {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #d4af37;
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.5);
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            transition: all 0.4s ease;
            animation: pulseGlow 2s infinite;
            letter-spacing: 2px;
        }

        .open-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            transform: scale(1.05);
            border-color: #d4af37;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
            50% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.6); }
            100% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        }

        /* --- ANA İÇERİĞİ GİZLEME VE GÖSTERME --- */
        .rain-canvas, .main-container {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease 0.5s; /* Buton kaybolduktan yarım saniye sonra yavaşça gelsin */
        }

        body.show-content .rain-canvas,
        body.show-content .main-container {
            opacity: 1;
            visibility: visible;
        }

        /* SOFİSTİKE YAĞMUR EFEKTİ */
        .rain-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* MERKEZİ CAM KART (GLASSMORPHISM) */
        .main-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 550px;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 2s ease;
            cursor: pointer;
        }

        /* PARILDAYAN AYDINLATMA EFEKTİ */
        .main-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, transparent, rgba(212, 175, 55, 0.3), transparent);
            border-radius: 24px;
            z-index: -1;
            opacity: 0.5;
        }

        /* TİPOGRAFİ VE BAŞLIKLAR */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ffffff 30%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1rem;
            color: #9ca3af;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
            font-weight: 300;
        }

        /* SANATSAL GÖRSEL ÇERÇEVESİ */
        .art-display {
            width: 100%;
            height: 380px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.4) 100%);
            border: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 35px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .art-display img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
            opacity: 0.85;
            transition: transform 0.5s ease;
        }

        .art-display:hover img {
            transform: scale(1.05);
        }

        .art-placeholder {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.4rem;
            color: rgba(212, 175, 55, 0.8);
            z-index: 1;
            letter-spacing: 1px;
        }

        /* MEKTUP VE MESAJ ALANI */
        .birthday-message {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #e5e7eb;
            font-weight: 300;
            margin-bottom: 30px;
        }

        /* KİŞİSEL ZARİF İMZA */
        .signature-block {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .signature-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.4rem;
            color: #d4af37;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        /* AÇILIŞ ANİMASYONU */
        body.show-content .main-container {
            animation: cubic-bezier(0.16, 1, 0.3, 1) fadeInEffect 2.5s forwards;
        }

        @keyframes fadeInEffect {
            from { transform: translateY(40px); }
            to { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="intro-screen" id="introScreen">
        <button class="open-btn" id="openBtn">Hediyeni Açmak İçin Tıkla</button>
    </div>

    <div class="rain-canvas" id="rainContainer"></div>

    <div class="main-container" id="interactiveCard">
        <header>
            <h1>İyi ki Doğdun,<br>Yağmur</h1>
            <div class="subtitle">Yeni Yaşın Kutlu Olsun</div>
        </header>

        <div class="art-display">
            <img src="" alt="" onerror="this.style.display='none';">
            <div class="art-placeholder">Seni Seviyorum dostum &lt;3</div>
        </div>

        <div class="birthday-message">
            <p>Hayatın tuvaline atacağın her yeni fırça darbesinin, seni hayallerine bir adım daha yaklaştırması dileğiyle. Yeni yaşın tüm güzellikleri ve ilhamı beraberinde getirsin.</p>
        </div>

        <footer class="signature-block">
            <div class="signature-text">- Can</div>
        </footer>
    </div>

    <script>
        /* YENİ: Butona Tıklama İşlevi */
        const openBtn = document.getElementById('openBtn');
        const introScreen = document.getElementById('introScreen');
        let rainInterval;

        openBtn.addEventListener('click', () => {
            // Giriş ekranını gizle
            introScreen.classList.add('hidden');
            
            // Animasyonlu bir şekilde içeriği göster
            document.body.classList.add('show-content');
            
            // Yağmur efektini başlat
            rainInterval = setInterval(createDrop, 100);
        });

        /* 1. ARKA PLANDAKİ PARLAK YAĞMUR ANİMASYONU */
        const rainContainer = document.getElementById('rainContainer');
        const maxDrops = 60;

        function createDrop() {
            if (rainContainer.children.length >= maxDrops) return;

            const drop = document.createElement('div');
            
            drop.style.position = 'absolute';
            drop.style.width = '1px';
            drop.style.height = Math.random() * 40 + 20 + 'px';
            drop.style.background = 'linear-gradient(transparent, rgba(212, 175, 55, 0.25))';
            drop.style.left = Math.random() * 100 + 'vw';
            drop.style.top = '-60px';
            drop.style.opacity = Math.random() * 0.7 + 0.3;
            
            const duration = Math.random() * 1.5 + 1;
            drop.style.transition = `transform ${duration}s linear, opacity ${duration}s ease`;
            
            rainContainer.appendChild(drop);

            setTimeout(() => {
                drop.style.transform = `translateY(${window.innerHeight + 100}px)`;
            }, 50);

            setTimeout(() => {
                drop.remove();
            }, duration * 1000);
        }

        /* 2. ETKİLEŞİMLİ 3D MOUSE HAREKETİ (TILT EFEKTİ) */
        const card = document.getElementById('interactiveCard');

        card.addEventListener('mousemove', (e) => {
            // Sadece içerik görünürken efekti çalıştır
            if (!document.body.classList.contains('show-content')) return;

            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const xc = rect.width / 2;
            const yc = rect.height / 2;
            
            const tiltX = (yc - y) / 20;
            const tiltY = (x - xc) / 20;
            
            card.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) translateY(-5px)`;
            card.style.boxShadow = `${-tiltY * 2}px ${tiltX * 2}px 50px rgba(0, 0, 0, 0.5), 0 30px 60px rgba(0, 0, 0, 0.4)`;
        });

        card.addEventListener('mouseleave', () => {
            if (!document.body.classList.contains('show-content')) return;
            card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0)';
            card.style.boxShadow = '0 30px 60px rgba(0, 0, 0, 0.4)';
        });
    </script>
</body>
</html>
